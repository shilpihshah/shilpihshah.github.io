name: Update VC Pulse data

on:
  schedule:
    - cron: "17 11 * * *"   # daily at 11:17 UTC (~7:17am ET)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data.json
        run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # Only the generated funding file. data/key_voices.json is edited by hand.
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily VC Pulse refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
